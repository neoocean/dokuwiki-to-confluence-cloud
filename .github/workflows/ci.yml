name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Syntax check
        run: python -m py_compile run.py
      - name: argparse smoke
        run: |
          python run.py --help
          python run.py discover --help
          python run.py convert --help
          python run.py upload --help
          python run.py rewrite-links --help
          python run.py lint --help
          python run.py report --help
          python run.py preview --help
          python run.py history-discover --help
          python run.py struct-discover --help
      - name: pytest
        run: python -m pytest tests/ -q
