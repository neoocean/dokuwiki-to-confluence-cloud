# 마이그레이션 스크립트의 라이브 테스트를 위해 호스트의 DokuWiki 데이터를
# APFS clonefile 로 만든 카피에서 띄우는 컴포즈. 호스트 원본 디렉터리
# `/Users/neoocean/p4/playground/docker/dokuwiki/data` 는 절대 수정되지 않는다.
#
# 사용:
#   # 14GB 데이터를 APFS clonefile 로 즉시 복제 (디스크 사용 거의 0).
#   cp -cR /Users/neoocean/p4/playground/docker/dokuwiki/data \
#          /tmp/dwc_test_dokuwiki/dwdata
#   docker compose -f dev/dokuwiki-local/docker-compose.yml up -d
#
#   # 띄운 인스턴스로 라이브 변환 테스트:
#   python run.py render  --base-url http://127.0.0.1:18080 --only wiki:syntax
#   python run.py convert --only wiki:syntax
#
#   # 끝나면:
#   docker compose -f dev/dokuwiki-local/docker-compose.yml down
#   rm -rf /tmp/dwc_test_dokuwiki/dwdata
#
# 주의:
#  - 마운트 경로는 호스트 절대경로 (macOS / 본 워크스테이션 기준). 다른 머신에서
#    쓰려면 두 경로를 환경에 맞춰 수정.
#  - DokuWiki 가 `data/pages` 등 여러 서브디렉터리에 대해 부팅 시 writable
#    검증을 수행하기 때문에 트리 전체를 writable 로 마운트해야 한다. APFS
#    clonefile 로 만든 복제본을 쓰므로 원본은 영향 없음.
#  - PHP 8.2 의 deprecation/warning 들이 export 응답 앞부분에 섞이지 않도록
#    `display_errors=Off` + `error_reporting=E_ERROR` 로 잠재운다.

services:
  dokuwiki-mig:
    image: php:8.2-apache
    container_name: dokuwiki-mig
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - /tmp/dwc_test_dokuwiki/dwdata:/var/www/html:rw
    command: >
      bash -c "
      echo 'display_errors=Off' > /usr/local/etc/php/conf.d/zz-quiet.ini &&
      echo 'error_reporting=E_ERROR' >> /usr/local/etc/php/conf.d/zz-quiet.ini &&
      a2enmod rewrite && apache2-foreground
      "
    restart: "no"
